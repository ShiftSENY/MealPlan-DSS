<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MealPlan DSS — Dashboard</title>
  <meta name="description" content="Plan your week of meals with less thinking. Manage ingredients, build your Filipino meal catalog, and get explained recommendations.">
  <meta name="theme-color" content="#e9f3df">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32x32.png">
  <link rel="apple-touch-icon" href="icons/icon-180x180.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>

<body class="app-body">

  <!-- ================= Auth gate ================= -->
  <div class="auth" id="auth-screen">
    <div class="auth__card">
      <img class="auth__logo" src="MealPlan_Logo.svg" alt="MealPlan DSS logo">
      <h1 class="auth__title">MealPlan DSS</h1>
      <p class="auth__sub">Sign in to plan your week. Your data is saved to your account.</p>

      <div class="auth__tabs" role="tablist">
        <button class="auth__tab is-active" type="button" data-auth-mode="sign-in" role="tab">Sign in</button>
        <button class="auth__tab" type="button" data-auth-mode="sign-up" role="tab">Create account</button>
      </div>

      <div class="auth__mount" id="auth-root">
        <p class="small text-muted">Loading sign-in…</p>
      </div>

      <p class="auth__back"><a href="index.html">&larr; Back to homepage</a></p>
    </div>
  </div>

  <!-- ================= Dashboard ================= -->
  <div class="app" id="dashboard" hidden>

    <header class="app-header">
      <button class="app-menu-toggle" type="button" id="sidebar-toggle" aria-label="Toggle navigation" aria-expanded="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
      </button>
      <a class="app-header__brand" href="index.html">
        <img class="app-header__logo" src="MealPlan_Logo.svg" alt="MealPlan DSS logo">
        <span>MealPlan&nbsp;DSS</span>
      </a>

      <div class="profile-menu" id="profile-menu">
        <button class="profile-menu__button" type="button" id="profile-toggle" aria-expanded="false" aria-haspopup="menu" aria-label="Open profile menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="8" r="3.5"/>
            <path d="M5 20c1.2-3.6 3.7-5.4 7-5.4s5.8 1.8 7 5.4"/>
          </svg>
        </button>
        <div class="profile-menu__panel" id="profile-panel" hidden>
          <span class="app-header__email" id="user-email"></span>
          <button class="btn btn--ghost btn--sm btn--full" type="button" id="logout-btn">Log out</button>
        </div>
      </div>
    </header>

    <div class="db-banner" id="db-banner" hidden>
      <strong>Database not configured.</strong>
      Paste your Neon connection string into <code>neon-config.js</code> and run
      <code>schema.sql</code> in the Neon SQL Editor. See <code>SETUP.md</code>.
    </div>

    <div class="app-shell">
      <aside class="app-sidebar" id="app-sidebar">
        <nav class="app-tabs" id="app-tabs" aria-label="Dashboard sections">
      <button class="app-tab is-active" type="button" data-view="suggestions">
        <svg class="app-tab__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3l1.9 4.8 4.8 1.9-4.8 1.9L12 16.4l-1.9-4.8L5.3 9.7l4.8-1.9z"/>
          <path d="M19 15l1 2.5 2.5 1-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1z"/>
          <path d="M5 16l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/>
        </svg>
        <span>Suggestions</span>
      </button>
      <button class="app-tab" type="button" data-view="plan">
        <svg class="app-tab__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
          <circle cx="8" cy="15" r="1"/>
          <circle cx="12" cy="15" r="1"/>
          <circle cx="16" cy="15" r="1"/>
        </svg>
        <span>Weekly Plan</span>
      </button>
      <button class="app-tab" type="button" data-view="meals">
        <svg class="app-tab__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          <path d="M12 6v6"/>
          <path d="M9 9h6"/>
        </svg>
        <span>Meal Catalog</span>
      </button>
      <button class="app-tab" type="button" data-view="inventory">
        <svg class="app-tab__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
          <path d="m3.3 7 8.7 5 8.7-5"/>
          <path d="M12 22V12"/>
        </svg>
        <span>Inventory</span>
      </button>
      <button class="app-tab" type="button" data-view="shopping">
        <svg class="app-tab__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="8" cy="21" r="1"/>
          <circle cx="19" cy="21" r="1"/>
          <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>
        </svg>
        <span>Shopping List</span>
      </button>
      <button class="app-tab" type="button" data-view="preferences">
        <svg class="app-tab__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="4" y1="21" x2="4" y2="14"/>
          <line x1="4" y1="10" x2="4" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="12"/>
          <line x1="12" y1="8" x2="12" y2="3"/>
          <line x1="20" y1="21" x2="20" y2="16"/>
          <line x1="20" y1="12" x2="20" y2="3"/>
          <line x1="1" y1="14" x2="7" y2="14"/>
          <line x1="9" y1="8" x2="15" y2="8"/>
          <line x1="17" y1="16" x2="23" y2="16"/>
        </svg>
        <span>Preferences</span>
      </button>
        </nav>
      </aside>

      <main class="app-main">
        <section class="view" id="view-suggestions"></section>
        <section class="view" id="view-plan" hidden></section>
        <section class="view" id="view-meals" hidden></section>
        <section class="view" id="view-inventory" hidden></section>
        <section class="view" id="view-shopping" hidden></section>
        <section class="view" id="view-preferences" hidden></section>
      </main>
    </div>
  </div>

  <!-- Toast for status messages -->
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <!-- Clerk (auto-initialises via the publishable-key attribute) -->
  <script
    async
    crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_aW1tZW5zZS1yYXZlbi05NDA0LmNsZXJrLmFjY291bnRzLmRldiQ"
    src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
    type="text/javascript"
  ></script>
  <script src="clerk-config.js"></script>

  <!-- App controller (ES module) -->
  <script type="module" src="app.js"></script>
</body>
</html>
